openapi: 3.0.3
info:
  title: KhelSetu API
  version: 1.0.0
  description: >
    # KhelSetu API Documentation


    ## Platform Overview


    KhelSetu is a multi-tenant sports tournament management platform with **two
    distinct portals**:


    ### 🌐 Public Portal (No Login Required)

    The public portal is for **viewers and fans** who want to watch live
    matches, browse tournaments, and view standings. These endpoints are
    **completely open** — no authentication needed.


    - **Live match scores** — Real-time scores for any match

    - **Tournament browsing** — View all public tournaments

    - **Standings & fixtures** — League tables and match schedules

    - **Team & player profiles** — Roster and player information

    - **Global search** — Search across tournaments, teams, and players


    ### 🔒 SaaS Dashboard (Login Required)

    The dashboard is for **organization members** (admins, scorers, coaches) who
    manage tournaments, teams, players, and live scoring. **All dashboard
    endpoints require JWT authentication** and **organization membership**.


    - **Organization management** — Create/manage organizations, invite members

    - **Tournament management** — Create tournaments, generate fixtures

    - **Team & player management** — Roster management, player profiles

    - **Live scoring** — Real-time event-driven scoring (Football, Cricket,
    Basketball)

    - **Standings** — Auto-calculated league tables

    - **RBAC** — Role-based access control (owner, admin, scorer, coach, viewer)

    - **Billing** — Subscription and payment management

    - **Analytics & Audit** — Usage analytics and audit logs


    ### 🔑 Authentication Flow


    1. **Register** → `POST /api/auth/register` (dashboard user) or `POST
    /api/public/users/register` (public user)

    2. **Login** → `POST /api/auth/login` → Returns JWT access token (15min) +
    refresh token (7d)

    3. **Use Token** → Pass as `Authorization: Bearer <token>` header for all
    dashboard endpoints

    4. **Refresh** → `POST /api/auth/refresh` → Get new access token when
    expired


    ### 🏢 Multi-Tenant Architecture


    Every organization (tenant) is **isolated**. A user must be a **member of an
    organization** to access its resources.


    - **Tenant Resolution**: Pass `x-organization-id` header, or include
    `organization_id` in request body/query

    - **Access Control**: If you're not a member of the organization → `403
    Forbidden`

    - **Staff Roles**: Tenant admin assigns roles (admin, tournament_admin,
    scorer, coach, viewer) with specific permissions


    ### 🆓 Free Tier Limits


    | Resource | Free | Starter | Professional | Enterprise |

    |----------|------|---------|--------------|------------|

    | Tournaments per org | 5 | 20 | 100 | Unlimited |

    | Teams per org | 10 | 50 | 200 | Unlimited |

    | Players per org | 50 | 200 | 1000 | Unlimited |

    | Matches per org | 100 | 500 | 2000 | Unlimited |


    **Public users** get **5 free matches** lifetime. On first match, a personal
    organization is auto-created.


    ---


    ## API Sections


    | Section | Auth Required | Description |

    |---------|--------------|-------------|

    | **Public Portal** | No | Live scores, tournament browsing, standings,
    search |

    | **Authentication** | No | Register, login, refresh tokens |

    | **Dashboard: Organizations** | Yes | Org CRUD, members, invitations |

    | **Dashboard: Tournaments** | Yes | Tournament CRUD, fixtures, progression
    |

    | **Dashboard: Teams & Players** | Yes | Team/player management |

    | **Dashboard: Matches** | Yes | Match lifecycle, officials |

    | **Dashboard: Scoring** | Yes | Live scoring (Football, Cricket,
    Basketball) |

    | **Dashboard: Standings** | Yes | League tables, snapshots |

    | **Dashboard: RBAC** | Yes | Roles, permissions, staff management |

    | **Dashboard: Billing** | Yes | Plans, subscriptions, invoices |

    | **Dashboard: Analytics & Audit** | Yes | Usage analytics, audit logs |

    | **Dashboard: Overlays & Visualization** | Yes | Broadcast overlays,
    tactical boards |

    | **Dashboard: Sync** | Yes | Offline sync queue |
  contact:
    name: KhelSetu Support
    email: support@khelsetu.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
paths:
  /api/auth/register:
    post:
      summary: Register new user
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - first_name
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                first_name:
                  type: string
                last_name:
                  type: string
                phone:
                  type: string
            example:
              email: user@example.com
              password: securePassword123
              first_name: John
              last_name: Doe
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
  /api/auth/login:
    post:
      summary: Login user
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
            example:
              email: user@example.com
              password: securePassword123
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
  /api/auth/refresh:
    post:
      summary: Refresh access token
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refresh_token
              properties:
                refresh_token:
                  type: string
      responses:
        "200":
          description: Tokens refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
  /api/auth/logout:
    post:
      summary: Logout user
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logged out successfully
  /api/auth/navigation:
    get:
      summary: Get role-based navigation config
      tags:
        - Auth
      security:
        - bearerAuth: []
      parameters:
        - name: organization_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Navigation config with permissions and feature flags
  /api/auth/me:
    get:
      summary: Get current user profile
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
  /api/auth/profile:
    put:
      summary: Update user profile
      tags:
        - Auth
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                phone:
                  type: string
                avatar:
                  type: string
      responses:
        "200":
          description: Profile updated
  /api/auth/change-password:
    post:
      summary: Change password
      tags:
        - Auth
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - current_password
                - new_password
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
                  minLength: 8
      responses:
        "200":
          description: Password changed successfully
  /api/organizations:
    post:
      summary: Create new organization
      tags:
        - Organizations
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                slug:
                  type: string
                description:
                  type: string
            example:
              name: Nepal Sports Federation
              slug: nsf
              description: National sports organization
      responses:
        "201":
          description: Organization created
    get:
      summary: Get user organizations
      tags:
        - Organizations
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of organizations
  /api/organizations/{id}:
    get:
      summary: Get organization by ID
      tags:
        - Organizations
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Organization details
    put:
      summary: Update organization
      tags:
        - Organizations
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Organization updated
    delete:
      summary: Delete organization
      tags:
        - Organizations
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Organization deleted
  /api/organizations/{id}/members:
    get:
      summary: Get organization members
      tags:
        - Organizations
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of members
  /api/organizations/{id}/invitations:
    post:
      summary: Invite user to organization
      tags:
        - Organizations
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                role:
                  type: string
      responses:
        "201":
          description: Invitation sent
  /api/organizations/{id}/members/{userId}:
    delete:
      summary: Remove member
      tags:
        - Organizations
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Member removed
  /api/organizations/invitations/{token}/accept:
    post:
      summary: Accept invitation
      tags:
        - Organizations
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Invitation accepted
  /api/sports:
    get:
      summary: Get all sports
      tags:
        - Sports
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
        - name: include_inactive
          in: query
