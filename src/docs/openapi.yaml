      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - organization_id
                - sport_id
                - name
              properties:
                organization_id:
                  type: string
                sport_id:
                  type: string
                name:
                  type: string
                format:
                  type: string
      responses:
        "201":
          description: Tournament created
    get:
      summary: Get tournaments by organization
      tags:
        - Tournaments
      security:
        - bearerAuth: []
      parameters:
        - name: organization_id
          in: query
          required: true
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of tournaments
  /api/tournaments/{id}:
    get:
      summary: Get tournament by ID
      tags:
        - Tournaments
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Tournament details
    put:
      summary: Update tournament
      tags:
        - Tournaments
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Tournament updated
    delete:
      summary: Delete tournament
      tags:
        - Tournaments
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Tournament deleted
  /api/tournaments/{id}/status:
    post:
      summary: Update tournament status
      tags:
        - Tournaments
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Status updated
  /api/tournaments/{id}/teams:
    get:
      summary: Get registered teams
      tags:
        - Tournaments
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of registered teams
    post:
      summary: Register team to tournament
      tags:
        - Tournaments
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Team registered
  /api/tournaments/{id}/teams/{teamId}:
    delete:
