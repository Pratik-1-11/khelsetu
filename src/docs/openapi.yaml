          in: query
          required: true
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of teams
  /api/teams/{id}:
    get:
      summary: Get team by ID
      tags:
        - Teams
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Team details
    put:
      summary: Update team
      tags:
        - Teams
      security:
        - bearerAuth: []
      responses:
        "200":
