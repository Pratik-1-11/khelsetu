                    - end_first_half
                    - start_second_half
                    - end_second_half
                    - start_extra_time
                    - end_extra_time_first
                    - start_extra_time_second
                    - end_extra_time
                    - start_penalties
                    - end_match
                    - abandon
                    - suspend
                    - resume
                injury_time:
                  type: integer
                winner_id:
                  type: string
                reason:
                  type: string
      responses:
        "200":
