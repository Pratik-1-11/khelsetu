  /api/matches/{id}/end:
    post:
      summary: End match
      tags:
        - Matches
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Match ended
  /api/matches/{id}/score:
    post:
      summary: Update match score
      tags:
