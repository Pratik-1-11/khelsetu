      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
      responses:
        "200":
          description: Match abandoned
  /api/matches/{id}/suspend:
    post:
      summary: Suspend match
      tags:
        - Matches
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
      responses:
        "200":
          description: Match suspended
  /api/matches/{id}/resume:
    post:
      summary: Resume suspended match
      tags:
        - Matches
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Match resumed
  /api/matches/{id}/postpone:
    post:
      summary: Postpone match
      tags:
        - Matches
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - new_date
                - reason
              properties:
                new_date:
                  type: string
                reason:
                  type: string
      responses:
        "200":
          description: Match postponed
  /api/scoring/matches/{matchId}/innings/start:
    post:
      summary: Start innings
      tags:
        - Cricket Scoring
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - innings_number
                - batting_team_id
                - bowling_team_id
              properties:
                innings_number:
                  type: integer
                batting_team_id:
                  type: string
                bowling_team_id:
                  type: string
      responses:
        "201":
          description: Innings started
  /api/scoring/matches/{matchId}/deliveries:
    post:
      summary: Add cricket delivery
      tags:
        - Cricket Scoring
      security:
        - bearerAuth: []
      description: Add a ball-by-ball delivery event. This is the core of event-driven
        cricket scoring.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - delivery_type
                - bowler_id
                - striker_id
                - non_striker_id
              properties:
                delivery_type:
                  type: string
                  enum:
