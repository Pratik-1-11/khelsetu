  /api/admin/users:
    post:
      summary: Create user (super admin only)
      tags:
        - Admin
      security:
        - bearerAuth: []
      responses:
        "201":
          description: User created
  /api/admin/tenants:
    post:
      summary: Onboard new tenant with subscription (super admin only)
      tags:
        - Admin
      security:
        - bearerAuth: []
      description: >-
        Create a new organization, owner user, and assign a subscription plan.


        **Request body:**

        - `org`: Organization details (name, slug, description, contact info,
        feature flags)

        - `owner`: Owner user details (email, password, first_name, last_name,
        phone)

        - `subscription`: Subscription config
          - `plan_id*: `free` | `starter` | `professional` | `enterprise`
          - `period_months`: Billing period in months (default: 1)
          - `trial_days`: Free trial days before billing starts (default: 0)
        - `send_invitation`: Send login credentials to owner (default: true)


        **Example:**

        ```json

        {
          "org": { "name": "Nepal Football Association", "slug": "nfa" },
          "owner": { "email": "admin@nfa.com", "password": "secure123", "first_name": "Ram" },
          "subscription": { "plan_id": "starter", "period_months": 12, "trial_days": 14 }
        }

        ```
      requestBody:
        content:
          application/json:
            example:
              org:
                name: Nepal Football Association
                slug: nfa
                description: Official football body
                contact_email: admin@nfa.com
              owner:
                email: admin@nfa.com
                password: secure123
                first_name: Ram
                last_name: Shrestha
              subscription:
                plan_id: starter
                period_months: 12
                trial_days: 14
              send_invitation: true
      responses:
        "201":
          description: Tenant onboarded successfully
          content:
            application/json:
              example:
                success: true
                data:
                  organization:
                    id: uuid
                    name: Nepal Football Association
                    slug: nfa
                  owner:
                    id: uuid
                    email: admin@nfa.com
                    first_name: Ram
                  subscription:
                    plan_id: starter
                    status: active
                    trial_days: 14
                    current_period_start: 2026-05-19T...
                    current_period_end: 2027-06-02T...
                  login_url: http://localhost:5173/login
                  credentials_sent: true
  /api/admin/tenants/{id}/subscription:
    post:
      summary: Assign or change tenant subscription (super admin only)
      tags:
        - Admin
      security:
        - bearerAuth: []
      description: |-
        Assign or upgrade/downgrade a tenant's subscription plan.

        **Request body:**
        - `plan_id*`: `free` | `starter` | `professional` | `enterprise`
        - `period_months`: Billing period in months (default: 1)
        - `start_date`: Custom start date (default: now)

        **Example:**
        ```json
        { "plan_id": "professional", "period_months": 6 }
        ```
      requestBody:
        content:
          application/json:
            example:
              plan_id: professional
              period_months: 6
      responses:
        "200":
          description: Subscription assigned
          content:
            application/json:
              example:
                success: true
                data:
                  id: uuid
                  plan_id: professional
                  status: active
                  current_period_start: 2026-05-19T...
                  current_period_end: 2026-11-19T...
  /api/admin/tenants/{id}/subscriptions:
    get:
      summary: Get tenant subscription history (super admin only)
      tags:
        - Admin
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Subscription history
  /api/admin/dashboard:
    get:
      summary: Get admin dashboard stats
      tags:
        - Admin
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dashboard statistics
  /api/admin/plans:
    get:
      summary: List available subscription plans (super admin only)
      tags:
        - Admin
      security:
        - bearerAuth: []
      description: Get all available plans for tenant onboarding and subscription
        assignment.
      responses:
        "200":
          description: List of plans
          content:
            application/json:
              example:
                success: true
                data:
                  - id: free
                    name: Free
                    price: 0
                    interval: month
                    features:
                      tournaments: 5
                      teams: 10
                      players: 50
                      matches: 100
                    is_active: true
                  - id: starter
                    name: Starter
                    price: 9.99
                    interval: month
                    features:
                      tournaments: 20
                      teams: 50
                      players: 200
                      matches: 500
                    is_active: true
                  - id: professional
                    name: Professional
                    price: 29.99
                    interval: month
                    features:
                      tournaments: 100
                      teams: 200
                      players: 1000
                      matches: 2000
                    is_active: true
                  - id: enterprise
                    name: Enterprise
                    price: 99.99
                    interval: month
                    features:
                      tournaments: -1
                      teams: -1
                      players: -1
                      matches: -1
                    is_active: true
servers:
  - url: http://localhost:3000
    description: Local development server
  - url: http://localhost:5173/api
    description: Production server
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "JWT access token. Get it from POST /api/auth/login. Pass as:
        Authorization: Bearer <token>"
  schemas:
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: Validation failed
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
    PaginationParams:
      type: object
      properties:
        page:
          type: integer
          example: 1
          description: Page number
        limit:
          type: integer
          example: 20
          description: Items per page
        sort:
          type: string
          example: created_at
          description: Sort field
        order:
          type: string
          example: DESC
          enum:
            - ASC
            - DESC
    PaginatedResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            type: object
        pagination:
          type: object
          properties:
            page:
              type: integer
            limit:
              type: integer
            total:
              type: integer
            totalPages:
              type: integer
    BasketballGameState:
      type: object
      properties:
        match:
          type: object
        possession:
          type: object
          properties:
            current_possession_team_id:
              type: string
            possession_arrow_team_id:
              type: string
        fouls:
          type: array
        stats:
          type: object
        periods:
          type: array
        shotClock:
          type: integer
        gameClock:
          type: integer
        quarter:
          type: integer
        overtimeCount:
          type: integer
    BasketballScore:
      type: object
      properties:
        home:
          type: integer
          example: 98
        away:
          type: integer
          example: 95
    BasketballStats:
      type: object
      properties:
        playerStats:
          type: array
        teamStats:
          type: array
    PossessionState:
      type: object
      properties:
        current_possession_team_id:
          type: string
        possession_arrow_team_id:
          type: string
        last_possession_event_id:
          type: string
    TeamFoulStatus:
      type: object
      properties:
        byQuarter:
          type: object
        total:
          type: integer
        bonus_status:
          type: string
          enum:
            - none
            - bonus
            - double_bonus
  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Unauthorized — Invalid or missing JWT token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Forbidden — You are not a member of this organization or lack
        required permission
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
security:
  - bearerAuth: []
tags:
  - name: 🌐 Public Portal
    description: 🔓 **No login required.** Live scores, tournament browsing,
      standings, team/player profiles, and search. For viewers and fans.
  - name: 🔑 Authentication
    description: 🔓 **No login required.** Register, login, refresh tokens. Used by
      both public and dashboard users.
  - name: 🏢 Organizations
    description: 🔒 **Login + org membership required.** Create/manage
      organizations, invite members, manage roles. Only for org owners and
      admins.
  - name: 🏆 Tournaments
    description: 🔒 **Login + org membership required.** Create tournaments,
      generate fixtures (league/knockout), manage progression.
  - name: 👥 Teams
    description: 🔒 **Login + org membership required.** Create/manage teams, team
      registrations for tournaments.
  - name: 🏃 Players
    description: 🔒 **Login + org membership required.** Create/manage players,
      assign to teams.
  - name: ⚽ Matches
    description: 🔒 **Login + org membership required.** Match lifecycle (scheduled
      → live → completed), officials, lineups.
  - name: 📊 Scoring
    description: 🔒 **Login + match:score permission required.** Event-driven live
      scoring. Supports Football, Cricket, Basketball. Undo/reverse events,
      deterministic replay.
  - name: 🏅 Standings
    description: 🔒 **Login + org membership required.** Auto-calculated league
      tables, head-to-head, snapshots.
  - name: 🛡️ RBAC
    description: 🔒 **Login + rbac:manage permission required.** Roles, permissions,
      staff assignment. Tenant admin creates staff with specific roles and
      permissions.
  - name: 💳 Billing
    description: "🔒 **Login + org admin required.** Plans, subscriptions, invoices,
      payment methods. Free tier: 5 tournaments per org."
  - name: 📈 Analytics
    description: 🔒 **Login + analytics:view permission required.** Usage analytics,
      event tracking.
  - name: 📋 Audit
    description: 🔒 **Login + audit:view permission required.** Audit logs for all actions.
  - name: 📺 Overlays
    description: 🔒 **Login + org membership required.** Broadcast overlay
      templates, live overlays for OBS/web.
  - name: 📐 Visualization
    description: 🔒 **Login + org membership required.** Tactical formations, annotations.
  - name: 🔄 Sync
    description: 🔒 **Login + org membership required.** Offline sync queue, device
      tracking, conflict resolution.
  - name: 🏏 Cricket Scoring
    description: 🔒 **Login + match:score permission required.** Ball-by-ball
      scoring, innings, DRS, DLS, super overs, powerplays.
  - name: 🏀 Basketball Scoring
    description: 🔒 **Login + match:score permission required.** Possession
      tracking, shot clock, fouls, free throws, timeouts, jump balls.
