      security:
        - bearerAuth: []
      responses:
        "200":
          description: Score updated
  /api/matches/{id}/officials:
    post:
      summary: Add match official
      tags:
        - Matches
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Official added
    get:
      summary: Get match officials
      tags:
        - Matches
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of officials
  /api/matches/{id}/officials/{userId}:
    delete:
      summary: Remove match official
      tags:
