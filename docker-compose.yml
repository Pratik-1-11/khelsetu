version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
      - "3001:3001"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: production-secret-change-me
      JWT_REFRESH_SECRET: refresh-secret-change-me
      NODE_ENV: development
      PG_POOL_MIN: 2
      PG_POOL_MAX: 10
      PG_POOL_IDLE_TIMEOUT: 10000
